name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    name: Python syntax and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - run: python -m pip install -r engine/requirements-dev.txt
      - run: python -m compileall -q engine/app engine/tests
      - run: python -m pytest tests/ -q
        working-directory: engine

  desktop:
    name: TypeScript, JavaScript, build and UI audit (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv engine/.venv
      - run: engine/.venv/bin/python -m pip install -r engine/requirements.txt
      - run: npm ci
      - name: JavaScript syntax
        run: |
          for file in electron/*.cjs scripts/*.cjs; do node --check "$file"; done
      - run: node scripts/test-security.cjs
      - run: node scripts/test-engine-integration.cjs
      - run: node scripts/test-launcher.cjs
      - run: node scripts/test-github.cjs
      - run: npm run build
      - name: End-to-end app audit (Xvfb)
        run: |
          log="$(mktemp)"
          if xvfb-run -a npm run audit:app >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            # Runner log downloads can be inaccessible to contributors;
            # surface the last failures as check annotations as well.
            tail -n 25 "$log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

  windows:
    name: Windows path and terminal regression checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No Electron GUI needed for the Windows path/argv unit checks.
      - run: npm ci --ignore-scripts
      - run: node scripts/test-security.cjs
      - run: python -m pip install -r engine/requirements-dev.txt
      - run: python -m pytest tests/test_security_boundaries.py -q
        working-directory: engine
